<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1016" />
    <title>WindDrift</title>
    <meta name="description" content="Watch wind move across the map, from recent days through the forecast." />
  </head>
  <body>
    <div id="map"></div>
    <div class="side">
      <header class="brand">
        <h1>WindDrift</h1>
        <p id="source">10 m wind</p>
        <div class="view-row">
          <select id="views" aria-label="Choose a view">
            <option value="">Live wind</option>
          </select>
          <button id="share" type="button">Share</button>
        </div>
        <button id="temperature" type="button" aria-pressed="false" hidden>Temperature</button>
        <p id="view-summary" hidden></p>
      </header>
      <section id="tracer" class="tracer" aria-label="Tracer" data-active="false">
        <div class="tracer-row">
          <div id="tracer-presets" class="tracer-presets" role="group" aria-label="What to release"></div>
          <button id="tracer-clear" type="button" hidden>Clear</button>
        </div>
        <p id="tracer-hint">Click the map to release it at the time shown, then press play.</p>
        <p id="tracer-title" hidden></p>
        <p id="tracer-detail" aria-live="polite" hidden></p>
        <p class="tracer-note">An illustration from 10 m wind only, with no vertical motion. The smoke and pollen settings are illustrative values, not measurements. Don't use it for safety decisions.</p>
      </section>
    </div>
    <div id="stats" hidden></div>
    <div id="notice" role="alert" hidden></div>
    <section class="timeline" aria-label="Time controls">
      <div class="timeline-main">
        <div class="timeline-labels">
          <span class="timeline-current">
            <output id="time-label" for="time">&nbsp;</output>
            <span id="phase"></span>
          </span>
          <span id="status" aria-live="polite">Loading…</span>
        </div>
        <div id="time-track" class="time-track">
          <input id="time" type="range" min="0" max="1" value="0" step="60000" aria-label="Time" />
          <span class="now-marker" aria-hidden="true"></span>
        </div>
        <div class="timeline-range" aria-hidden="true">
          <span id="range-start"></span>
          <span id="data-age"></span>
          <span id="range-end"></span>
        </div>
      </div>
      <div id="temperature-legend" class="temperature-legend" hidden>
        <div class="legend-scale">
          <div id="legend-bar" class="legend-bar"></div>
          <div id="legend-ticks" class="legend-ticks" aria-hidden="true"></div>
        </div>
        <output id="temperature-reading" aria-label="Temperature at the cursor"></output>
        <button id="temperature-unit" type="button"></button>
      </div>
      <div class="timeline-controls">
        <div class="transport">
          <button id="step-back" class="control" type="button" aria-label="Back one hour" title="Back one hour (Shift: three hours)">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3 2.5h2v11H3zM13 2.5v11L6 8z" fill="currentColor" /></svg>
          </button>
          <button id="play" class="control" type="button" aria-label="Play">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path id="play-icon" d="M4 2.5v11l9-5.5z" fill="currentColor" /></svg>
          </button>
          <button id="step-forward" class="control" type="button" aria-label="Forward one hour" title="Forward one hour (Shift: three hours)">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M11 2.5h2v11h-2zM3 2.5v11L10 8z" fill="currentColor" /></svg>
          </button>
        </div>
        <div id="speeds" class="speeds" role="group" aria-label="Playback speed"></div>
        <button id="new-forecast" type="button" title="Reload to get the latest wind data" hidden>New forecast</button>
        <button id="now" type="button">Now</button>
      </div>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
